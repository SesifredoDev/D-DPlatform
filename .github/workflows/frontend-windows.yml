name: Frontend Windows Build

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Tauri resource directory exists
        run: New-Item -ItemType Directory -Path src-tauri/bin -Force | Out-Null

      - name: Build Tauri app
        run: npm run tauri build -- --verbose
