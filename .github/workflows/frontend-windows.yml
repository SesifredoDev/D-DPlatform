name: Frontend Windows Build

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Tauri resource directory exists
        run: New-Item -ItemType Directory -Path src-tauri/bin -Force | Out-Null

      - name: Normalize updater signing key
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = "$env:RAW_TAURI_SIGNING_PRIVATE_KEY".Trim()
          $key = $key -replace "`r", ""
          $key = $key -replace "\\n", "`n"

          if (-not $key.StartsWith("untrusted comment:")) {
            try {
              $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($key))
              $decoded = $decoded -replace "`r", ""
              if ($decoded.StartsWith("untrusted comment:")) {
                $key = $decoded
              }
            } catch {
            }
          }

          if (-not $key.StartsWith("untrusted comment:")) {
            throw "Invalid TAURI_SIGNING_PRIVATE_KEY format. Expected minisign secret key starting with 'untrusted comment:'."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $key
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Build Tauri app
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Resolve app version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundle
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Publish update assets to GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Astral Project Desktop v${{ steps.version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
