name: Frontend Linux Build

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-linux.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-linux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
