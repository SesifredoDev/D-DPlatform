name: Frontend macOS Build

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-macos.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Tauri resource directory exists
        run: mkdir -p src-tauri/bin

      - name: Build Tauri app
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Resolve app version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-bundle
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Publish update assets to GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Astral Project Desktop v${{ steps.version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.sig
