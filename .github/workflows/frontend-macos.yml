name: Frontend macOS Build

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-macos.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/frontend-macos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Tauri resource directory exists
        run: mkdir -p src-tauri/bin

      - name: Build Tauri app
        run: npm run tauri build -- --verbose

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-bundle
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
