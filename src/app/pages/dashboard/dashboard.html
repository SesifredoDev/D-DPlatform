
  <app-side-panel class="sidebar"></app-side-panel>

  <main class="content-area" [class.split-view]="showMessages && showVideo">

    @if (showVideo) {
      <div class="video-container">
        <app-video-call [channelId]="messageChannelID"></app-video-call>
      </div>
    }

    @if (showMessages) {
      <div class="chat-container">
        <app-text-channel [channelId]="messageChannelID" [currentCharacterId]="activeCharacterID"></app-text-channel>
      </div>
    }

  </main>
