<div class="auth-container">
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title class="title">D&D Project</mat-card-title>
      <mat-card-subtitle class="subtitle">
        Adventure Awaits
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-tab-group mat-stretch-tabs animationDuration="300ms">

        <!-- LOGIN TAB -->
        <mat-tab label="Login">
          <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="login()">
            <mat-form-field appearance="fill">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" />
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Password</mat-label>
              <input matInput type="password" formControlName="password" />
            </mat-form-field>

            <button
              mat-raised-button
              color="primary"
              class="auth-button"
              type="submit"
            >
              Login
            </button>
          </form>
        </mat-tab>

        <!-- SIGN UP TAB -->
        <mat-tab label="Sign up">
          <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="register()">
            <mat-form-field appearance="fill">
              <mat-label>Username</mat-label>
              <input matInput type="name" formControlName="username" />
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" />
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Password</mat-label>
              <input matInput type="password" formControlName="password" />
            </mat-form-field>

            <button
              mat-raised-button
              color="primary"
              class="auth-button"
              type="submit"
            >
              Create Account
            </button>
          </form>
        </mat-tab>

      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</div>
