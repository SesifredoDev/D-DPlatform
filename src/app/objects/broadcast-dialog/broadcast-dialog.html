<h2 mat-dialog-title>Broadcast Image</h2>
<mat-dialog-content>
  <div class="preview-container">
    <img [src]="imagePreview" alt="Preview" class="image-preview">
  </div>

  <div class="options-container">
    <h3>Select Destinations</h3>

    <div class="section">
      <h4>Text Channels</h4>
      <mat-selection-list [(ngModel)]="selectedChannels">
        @for (channel of textChannels; track channel._id) {
          <mat-list-option [value]="channel._id">
            <mat-icon matListItemIcon>chat</mat-icon>
            {{ channel.name }}
          </mat-list-option>
        }
      </mat-selection-list>
    </div>

    <div class="section" *ngIf="isCallActive">
      <h4>Active Call</h4>
      <mat-checkbox [(ngModel)]="broadcastToCall">Overlay on Everyone's Screen</mat-checkbox>
    </div>

    <div class="section" *ngIf="isVttActive">
      <h4>VTT</h4>
      <mat-checkbox [(ngModel)]="broadcastToVtt">Add as non-player token</mat-checkbox>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="progress-info" *ngIf="uploading && uploadProgress > 0" style="margin-right: 15px; display: flex; align-items: center; gap: 8px;">
    <span>{{ uploadProgress }}%</span>
    <mat-progress-spinner
      mode="determinate"
      [value]="uploadProgress"
      diameter="20"
      strokeWidth="3">
    </mat-progress-spinner>
  </div>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!canBroadcast() || uploading" (click)="broadcast()">
    <span *ngIf="!uploading">Broadcast</span>
    <mat-spinner diameter="20" *ngIf="uploading && uploadProgress === 0"></mat-spinner>
    <span *ngIf="uploading && uploadProgress > 0">Uploading...</span>
  </button>
</mat-dialog-actions>
