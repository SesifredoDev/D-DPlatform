<div class="app-window-shell" [class.tauri-window]="isTauriWindow()" [class.panel-window]="!!tabPanelId">
  @if (isTauriWindow()) {
    <!-- Floats over the right end of the tab bar so window controls and tabs read as one bar -->
    <header class="app-window-frame">
      <div class="app-window-controls">
        @if (!tabPanelId) {
          <button type="button" class="window-control" title="D&D search" aria-label="Open D&D 5e search" (click)="openDndSearch()">
            <span class="material-icons" aria-hidden="true">search</span>
          </button>
        }
        <button type="button" class="window-control" title="Shrink" aria-label="Shrink window" (click)="shrinkWindow()">
          <span class="material-icons" aria-hidden="true">remove</span>
        </button>
        <button
          type="button"
          class="window-control"
          [title]="isWindowMaximized() ? 'Restore' : 'Maximise'"
          [attr.aria-label]="isWindowMaximized() ? 'Restore window' : 'Maximise window'"
          (click)="toggleMaximize()">
          <span class="material-icons" aria-hidden="true">{{ isWindowMaximized() ? 'filter_none' : 'crop_square' }}</span>
        </button>
        <button
          type="button"
          class="window-control"
          [title]="isWindowFullscreen() ? 'Exit fullscreen' : 'Fullscreen'"
          [attr.aria-label]="isWindowFullscreen() ? 'Exit fullscreen' : 'Fullscreen'"
          (click)="toggleFullscreen()">
          <span class="material-icons" aria-hidden="true">{{ isWindowFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</span>
        </button>
        <button type="button" class="window-control close" title="Close" aria-label="Close window" (click)="closeWindow()">
          <span class="material-icons" aria-hidden="true">close</span>
        </button>
      </div>
    </header>
  }

  <div class="app-window-content">
    @if (tabPanelId; as panelId) {
      <app-dashboard [externalPanelId]="panelId"></app-dashboard>
    } @else {
      <app-dnd-search-drawer [showHandle]="!isTauriWindow()" [titlebarMode]="isTauriWindow()" />
      <router-outlet />
    }
  </div>
</div>
